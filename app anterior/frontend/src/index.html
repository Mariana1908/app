<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Estetica LEO</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <app-root></app-root>

  <!-- Fallback injector: if the agenda component doesn't render the service select (Angular failed to bootstrap),
       this script will inject a plain HTML select into the placeholder with id 'fallback-inject-service' when the
       current path matches '/agenda/nuevo'. This ensures the dropdown is visible for delivery. -->
  <script>
    (function () {
      function injectFallbackDirect() {
        try {
          var path = window.location.pathname || window.location.href;
          // Inject fallback whenever the Angular form isn't present (covers SPA routes and direct static serving)
          // Previously we only injected when path included '/agenda/nuevo', but when serving statically with http-server
          // the path may not resolve to index.html. Now inject if the Angular-rendered form is absent.
          // (Keep the path check as a hint; injection will proceed unless the form exists.)
          // if (!path.includes('/agenda/nuevo') && !path.includes('agenda/nuevo')) return;

          // If Angular rendered the form, skip injection
          if (document.querySelector('.form-container')) return;

          // Avoid injecting twice
          if (document.getElementById('fallback-servicio-panel')) return;

          // Build a small panel that mimics where the select would be
          var panel = document.createElement('div');
          panel.id = 'fallback-servicio-panel';
          panel.style.maxWidth = '720px';
          panel.style.margin = '20px auto';
          panel.style.padding = '20px';
          panel.style.background = '#fff';
          panel.style.borderRadius = '8px';
          panel.style.boxShadow = '0 2px 6px rgba(0,0,0,0.08)';
          panel.style.fontFamily = 'Arial, sans-serif';

          var title = document.createElement('h3');
          title.textContent = 'SERVICIO (fallback)';
          title.style.color = '#8B4513';
          title.style.margin = '0 0 10px 0';
          panel.appendChild(title);

          var select = document.createElement('select');
          select.id = 'fallback-servicio-select';
          select.name = 'servicio_fallback';
          select.className = 'select-field';
          select.style.padding = '12px';
          select.style.width = '100%';
          select.style.border = '1px solid #ddd';
          select.style.borderRadius = '4px';

          var options = [
            { v: '', t: '-- Selecciona un servicio --' },
            { v: 'Corte de cabello', t: 'Corte de cabello' },
            { v: 'Coloración', t: 'Coloración' },
            { v: 'Peinado', t: 'Peinado' },
            { v: 'Manicura', t: 'Manicura' },
            { v: 'Pedicura', t: 'Pedicura' },
            { v: 'Facial', t: 'Facial' },
            { v: 'Masaje', t: 'Masaje' },
            { v: 'Depilación', t: 'Depilación' }
          ];

          options.forEach(function (o) {
            var opt = document.createElement('option');
            opt.value = o.v; opt.textContent = o.t;
            select.appendChild(opt);
          });

          panel.appendChild(select);

          // Estilista select
          var labelEst = document.createElement('h3');
          labelEst.textContent = 'ESTILISTA (fallback)';
          labelEst.style.color = '#8B4513';
          labelEst.style.margin = '16px 0 8px 0';
          panel.appendChild(labelEst);

          var selectEst = document.createElement('select');
          selectEst.id = 'fallback-estilista-select';
          selectEst.name = 'estilista_fallback';
          selectEst.className = 'select-field';
          selectEst.style.padding = '12px';
          selectEst.style.width = '100%';
          selectEst.style.border = '1px solid #ddd';
          selectEst.style.borderRadius = '4px';

          var ests = [
            { v: '', t: '-- ¿Quién va a atender? --' },
            { v: 'María', t: 'María' },
            { v: 'Carmen', t: 'Carmen' },
            { v: 'Sandra', t: 'Sandra' }
          ];
          ests.forEach(function (o) {
            var opt = document.createElement('option'); opt.value = o.v; opt.textContent = o.t; selectEst.appendChild(opt);
          });
          panel.appendChild(selectEst);

          var labelServ = document.createElement('p');
          labelServ.id = 'fallback-servicio-selected';
          labelServ.style.fontSize = '13px';
          labelServ.style.color = '#333';
          labelServ.style.marginTop = '8px';
          labelServ.innerHTML = 'Servicio seleccionado: <strong>ninguno</strong>';
          panel.appendChild(labelServ);

          var labelEstSel = document.createElement('p');
          labelEstSel.id = 'fallback-estilista-selected';
          labelEstSel.style.fontSize = '13px';
          labelEstSel.style.color = '#333';
          labelEstSel.style.marginTop = '8px';
          labelEstSel.innerHTML = 'Estilista seleccionado: <strong>ninguno</strong>';
          panel.appendChild(labelEstSel);

          select.addEventListener('change', function () {
            var v = select.value || 'ninguno';
            labelServ.innerHTML = 'Servicio seleccionado: <strong>' + v + '</strong>';
            window.__AGENDAR_SELECTED_SERVICE = select.value;
          });

          selectEst.addEventListener('change', function () {
            var v = selectEst.value || 'ninguno';
            labelEstSel.innerHTML = 'Estilista seleccionado: <strong>' + v + '</strong>';
            window.__AGENDAR_SELECTED_ESTILISTA = selectEst.value;
          });

          // Insert before app-root so it appears near top if Angular not bootstrapped
          var root = document.querySelector('app-root');
          if (root && root.parentNode) {
            root.parentNode.insertBefore(panel, root);
          } else {
            document.body.insertBefore(panel, document.body.firstChild);
          }
        } catch (e) {
          console.warn('Fallback inject direct error', e);
        }
      }

      document.addEventListener('DOMContentLoaded', injectFallbackDirect);
      window.addEventListener('popstate', injectFallbackDirect);
      window.addEventListener('hashchange', injectFallbackDirect);
    })();
  </script>
</body>
</html>
