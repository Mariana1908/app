<main class="container my-4">
  <div class="p-3 border rounded mb-4">
    
    <!-- Título y selector directo -->
    <h3>Servicios</h3>
    
    <select id="servicios" class="form-select" [(ngModel)]="servicioSeleccionado">
      @for (servicio of servicios; track servicio) {
        <option [value]="servicio">{{ servicio }}</option>
      }
    </select>

    <p class="mt-2">
      Servicio seleccionado: <strong>{{ servicioSeleccionado }}</strong>
    </p>
    
  </div>

  <!-- El resto del código de la card de reportes y router-outlet se queda igual abajo -->
