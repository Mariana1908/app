<main class="container my-4">

  <!-- Panel de Control Principal (Fijo) -->
  <div class="p-4 border rounded bg-light mb-4 shadow-sm">
    <h2 class="h4 mb-1">Panel de Control</h2>
    <p class="text-muted mb-4">¿Qué vamos a hacer hoy, Administrador?</p>

    <div class="row g-3">
      <!-- Tarjeta 1: Clientes -->
      <div class="col-md-4">
        <div class="card h-100 shadow-sm custom-card" [routerLink]="['/clientes']" style="cursor: pointer;">
          <div class="card-body">
            <h5 class="card-title text-primary">Gestión de Clientes</h5>
            <p class="card-text text-secondary">Registra y consulta tus clientes.</p>
          </div>
        </div>
      </div>

      <!-- Tarjeta 2: Agenda -->
      <div class="col-md-4">
        <div class="card h-100 shadow-sm custom-card" [routerLink]="['/agenda/nuevo']" style="cursor: pointer;">
          <div class="card-body">
            <h5 class="card-title text-primary">Agenda de Citas</h5>
            <p class="card-text text-secondary">Consulta y organiza tus citas.</p>
          </div>
        </div>
      </div>

      <!-- Tarjeta 3: Reportes -->
      <div class="col-md-4">
        <div class="card h-100 shadow-sm custom-card" [routerLink]="['/reportes']" style="cursor: pointer;">
          <div class="card-body">
            <h5 class="card-title text-primary">Reportes y Estadísticas</h5>
            <p class="card-text text-secondary">Consulta métricas e ingresos.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Salida dinámica de las vistas de Angular -->
  <router-outlet></router-outlet>

</main>
