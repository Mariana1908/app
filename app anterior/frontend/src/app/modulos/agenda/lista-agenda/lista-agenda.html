<div class="agenda-container">

  <!-- BANNER DE ENCABEZADO -->
  <div class="header-banner">
    <div class="header-left">
      <button type="button" class="btn-primary-custom" (click)="irAlMenu()">
        Menú principal
      </button>
      <h1 class="header-title">Agenda de Citas</h1>
    </div>

    <div class="header-actions">
      <button type="button" class="btn-primary-custom" (click)="agendarCita()">
        + Agendar nueva cita
      </button>
      <button type="button" class="btn-primary-custom" (click)="nuevoCliente()">
        + Nuevo Cliente
      </button>
    </div>
  </div>

  <!-- TARJETA DE FILTROS -->
  <div class="card-box filter-card">
    <div class="filter-group">
      <div class="btn-toggle-group">
        <button type="button" class="btn-toggle active">Hoy</button>
        <button type="button" class="btn-toggle">Semana</button>
        <button type="button" class="btn-toggle">Mes</button>
      </div>

      <div class="filter-item">
        <label>Día:</label>
        <input type="date" class="input-filter" />
      </div>

      <div class="filter-item">
        <label>Estilista:</label>
        <select class="select-filter">
          <option value="">-- Todos --</option>
        </select>
      </div>

      <div class="filter-item">
        <label>Estatus Cita:</label>
        <select class="select-filter">
          <option value="">Todos</option>
        </select>
      </div>

      <button type="button" class="btn-limpiar">Limpiar filtros</button>
    </div>
  </div>

  <!-- TARJETA DE TABLA DE CITAS -->
  <div class="card-box table-card">
    <table class="custom-table">
      <thead>
        <tr>
          <th>Fecha/Hora</th>
          <th>Cliente</th>
          <th>Estilista</th>
          <th>Notas</th>
          <th>Anticipo</th>
          <th>Estatus de anticipo</th>
          <th>Referencia bancaria</th>
          <th>Estatus cita</th>
          <th class="text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td colspan="9" class="no-data">No hay citas registradas para este filtro.</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
