<div class="container">
  
  <!-- ENCABEZADO -->
  <div class="header">
    <button type="button" class="btn-volver" (click)="volverAlPanel()">
      Volver al panel de citas
    </button>
    <h1>Agendar Nueva Cita</h1>
  </div>

  <!-- FORMULARIO -->
  <div class="form-container">
    <form (ngSubmit)="agendarCita()">
      
      <!-- BUSCAR CLIENTE -->
      <div class="form-group">
        <label class="label-title">BUSCAR CLIENTE (NOMBRE O CELULAR):</label>
        <input 
          type="text" 
          class="input-field" 
          placeholder="Escribe nombre o teléfono..." 
          [(ngModel)]="clienteSearch" 
          name="clienteSearch" 
        />
      </div>

      <!-- ESTILISTA -->
      <div class="form-group">
        <label class="label-title">ESTILISTA:</label>
        <select class="select-field" [(ngModel)]="estilista" name="estilista">
          <option value="" disabled selected>-- ¿Quién va a atender? --</option>
          @for (est of estilistas; track est.id) {
            <option [value]="est.nombre">{{ est.nombre }}</option>
          }
        </select>
      </div>

      <!-- SERVICIO -->
      <div class="form-group">
        <label class="label-title">SERVICIO:</label>
        <select class="select-field" [(ngModel)]="servicio" name="servicio">
          <option [value]="null" disabled selected>-- Selecciona un servicio --</option>
          @for (srv of servicios; track srv.id) {
            <option [value]="srv.id">{{ srv.nombre }} - ${{ srv.precio }}</option>
          }
        </select>
      </div>

      <!-- FECHA -->
      <div class="form-group">
        <label class="label-title">FECHA:</label>
        <input 
          type="date" 
          class="input-field" 
          [(ngModel)]="fecha" 
          name="fecha" 
        />
      </div>

      <!-- HORA DE INICIO Y HORA DE FIN -->
      <div class="form-group-row">
        <div class="form-group-half">
          <label class="label-title">HORA DE INICIO:</label>
          <input 
            type="time" 
            class="input-field" 
            [(ngModel)]="horaInicio" 
            name="horaInicio" 
          />
        </div>

        <div class="form-group-half">
          <label class="label-title">HORA DE FIN:</label>
          <input 
            type="time" 
            class="input-field" 
            [(ngModel)]="horaFin" 
            name="horaFin" 
          />
        </div>
      </div>

      <!-- NOTAS -->
      <div class="form-group">
        <label class="label-title">NOTAS / INSTRUCCIONES:</label>
        <textarea 
          class="textarea-field" 
          rows="3" 
          placeholder="Escribe notas adicionales..." 
          [(ngModel)]="notas" 
          name="notas"
        ></textarea>
      </div>

      <!-- ANTICIPO REQUERIDO -->
<div class="form-group">
  <label class="label-title">ANTICIPO REQUERIDO ($):</label>
  <input 
    type="number" 
    class="input-field" 
    placeholder="0.00" 
    min="0"
    step="0.01"
    [(ngModel)]="anticipo" 
    name="anticipo" 
  />
</div>

      <!-- BOTON -->
      <div class="button-group">
        <button type="submit" class="btn-agendar">
          Confirmar Cita
        </button>
      </div>

    </form>
  </div>

</div>
