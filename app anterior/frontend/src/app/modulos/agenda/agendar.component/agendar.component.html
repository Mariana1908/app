<div class="card shadow-sm mb-4">
  <div class="card-header bg-secondary text-white d-flex justify-content-between align-items-center py-3">
    <h3 class="h4 mb-0">Agendar Nueva Cita</h3>
    <button class="btn btn-light btn-sm fw-bold" (click)="volverAlPanel()">Volver al panel de citas</button>
  </div>

  <div class="card-body p-4">
    <!-- BUSCAR CLIENTE -->
    <div class="mb-3">
      <label class="form-label fw-bold">BUSCAR CLIENTE (NOMBRE O CELULAR):</label>
      <input 
        type="text" 
        [(ngModel)]="clienteSearch"
        name="clienteSearch"
        class="form-control"
        placeholder="Escribe nombre o teléfono..."
      />
    </div>

    <!-- ESTILISTA Y SERVICIO -->
    <div class="row g-3 mb-3">
      <div class="col-md-6">
        <label class="form-label fw-bold">ESTILISTA:</label>
        <select [(ngModel)]="estilista" name="estilista" class="form-select">
          <option value="">-- ¿Quién va a atender? --</option>
          @for (est of estilistas; track est.nombre) {
            <option [value]="est.nombre">{{ est.nombre }}</option>
          }
        </select>
      </div>

      <div class="col-md-6">
        <label class="form-label fw-bold">SERVICIO:</label>
        <select [(ngModel)]="servicio" name="servicio" class="form-select">
          <option value="">-- Selecciona un servicio --</option>
          @for (srv of servicios; track srv.nombre) {
            <option [value]="srv.nombre">{{ srv.nombre }}</option>
          }
        </select>
      </div>
    </div>

    <!-- FECHA Y HORAS -->
    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <label class="form-label fw-bold">FECHA:</label>
        <input 
          type="date"
          [(ngModel)]="fecha"
          name="fecha"
          class="form-control"
        />
      </div>

      <div class="col-md-4">
        <label class="form-label fw-bold">HORA DE INICIO:</label>
        <input 
          type="time"
          [(ngModel)]="horaInicio"
          name="horaInicio"
          class="form-control"
        />
      </div>

      <div class="col-md-4">
        <label class="form-label fw-bold">HORA DE FIN:</label>
        <input 
          type="time"
          [(ngModel)]="horaFin"
          name="horaFin"
          class="form-control"
        />
      </div>
    </div>

    <!-- NOTAS -->
    <div class="mb-4">
      <label class="form-label fw-bold">NOTAS / INSTRUCCIONES:</label>
      <textarea 
        [(ngModel)]="notas"
        name="notas"
        class="form-control"
        rows="3"
        placeholder="Escribe notas adicionales..."
      ></textarea>
    </div>

    <!-- BOTONES -->
    <div class="d-flex gap-2">
      <button (click)="agendarCita()" class="btn btn-primary px-4">Agendar Cita</button>
      <button (click)="resetForm()" class="btn btn-outline-secondary px-4">Limpiar Formulario</button>
    </div>
  </div>
</div>
