<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <h2>Estética Leo</h2>
      <p>Bienvenido/a al sistema de administración</p>
    </div>

    <form (ngSubmit)="iniciarSesion()">
      <div class="form-group">
        <input 
          type="text" 
          class="input-field" 
          placeholder="Ingresa tu Nombre o Celular" 
          [(ngModel)]="usuario" 
          name="usuario" 
          required 
        />
      </div>

      <div class="form-group">
        <input 
          type="password" 
          class="input-field" 
          placeholder="Contraseña" 
          [(ngModel)]="password" 
          name="password" 
          required 
        />
      </div>

      <!-- Alerta de error (se muestra solo cuando errorMessage tiene texto) -->
      <div *ngIf="errorMessage" class="error-alert">
        {{ errorMessage }}
      </div>

      <button type="submit" class="btn-login">Entrar</button>
    </form>
  </div>
</div>
