<div class="dashboard-wrapper">
  
  <!-- BARRA DE NAVEGACIÓN SUPERIOR -->
  <header class="navbar-header">
    <div class="brand-title">Estética Leo</div>
    <div class="user-menu">
      <span class="user-greeting">Hola, <strong>Administrador</strong></span>
      <button type="button" class="btn-salir" (click)="cerrarSesion()">Salir</button>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="dashboard-container">
    
    <!-- ENCABEZADO DE BIENVENIDA -->
    <div class="welcome-section">
      <h1 class="welcome-title">Panel de Control</h1>
      <p class="welcome-subtitle">¿Qué vamos a hacer hoy, Administrador?</p>
    </div>

    <!-- TARJETAS DE OPCIONES EN GRID -->
    <div class="row g-4">
      
      <!-- Tarjeta 1: Clientes -->
      <div class="col-md-4">
        <div class="dashboard-card" [routerLink]="['/clientes']">
          <div class="card-icon icon-blue"></div>
          <div class="card-info">
            <h2>Gestión de Clientes</h2>
            <p>Registra y consulta tus clientes.</p>
          </div>
        </div>
      </div>

      <!-- Tarjeta 2: Agenda -->
      <div class="col-md-4">
        <div class="dashboard-card" [routerLink]="['/agenda/nuevo']">
          <div class="card-icon icon-green"></div>
          <div class="card-info">
            <h2>Agenda de Citas</h2>
            <p>Consulta y organiza tus citas.</p>
          </div>
        </div>
      </div>

      <!-- Tarjeta 3: Reportes -->
      <div class="col-md-4">
        <div class="dashboard-card" [routerLink]="['/reportes']">
          <div class="card-icon icon-purple"></div>
          <div class="card-info">
            <h2>Reportes y Estadísticas</h2>
            <p>Consulta métricas e ingresos.</p>
          </div>
        </div>
      </div>

    </div>

  </main>

</div>
