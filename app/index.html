<style>*{margin:0;padding:0;box-sizing:border-box}:root{--primary:#8b5cf6;--primary-dark:#7c3aed;--primary-light:#a78bfa;--secondary:#ec4899;--secondary-dark:#db2777;--success:#10b981;--success-dark:#059669;--danger:#ef4444;--danger-dark:#dc2626;--warning:#f59e0b;--warning-dark:#d97706;--info:#3b82f6;--info-dark:#2563eb;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;--gray-900:#111827;--shadow-sm:0 1px 2px 0 rgba(0, 0, 0, .05);--shadow-md:0 2px 4px -1px rgba(0, 0, 0, .1);--shadow-lg:0 4px 6px -1px rgba(0, 0, 0, .1);--shadow-xl:0 8px 12px -2px rgba(0, 0, 0, .1);--radius-sm:4px;--radius-md:6px;--radius-lg:8px;--radius-xl:12px;--space-xs:.25rem;--space-sm:.5rem;--space-md:.75rem;--space-lg:1rem;--space-xl:1.25rem;--space-2xl:1.5rem}body{font-family:Inter,Segoe UI,Tahoma,Geneva,Verdana,sans-serif;background-color:var(--gray-50);color:var(--gray-900);line-height:1.5;font-size:14px;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}</style><link rel="stylesheet" href="styles-Y3I6IKSW.css" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="styles-Y3I6IKSW.css"></noscript></head>
<body>
  <app-root></app-root>
<script src="polyfills-FFHMD2TL.js" type="module"></script><script src="main-GR5BUBRG.js" type="module"></script>
<script>
(() => {
  const addCard = () => {
    const grid = document.querySelector('.button-grid');
    if (!grid || document.querySelector('.card-reportes')) return Boolean(grid);
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'dash-card card-reportes';
    card.innerHTML = '<div class="card-icon"><i class="fas fa-chart-bar"></i></div><div class="card-info"><h3>Reportes</h3><p>Consulta indicadores y el resumen de tu negocio.</p></div><i class="fas fa-chevron-right arrow"></i>';
    grid.appendChild(card);
    return true;
  };
  const style = document.createElement('style');
  style.textContent = '.card-reportes .card-icon{background:#fff3e0;color:#f57c00}.card-reportes:hover .arrow{color:#f57c00}';
  document.head.appendChild(style);
  const observer = new MutationObserver(() => { if (addCard()) observer.disconnect(); });
  observer.observe(document.documentElement, { childList: true, subtree: true });
  addCard();
})();
</script></body>
</html>
